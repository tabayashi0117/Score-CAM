[project]
name = "score-cam"
version = "0.2.0"
description = "Keras 3 / tf.keras implementation of Grad-CAM, Grad-CAM++, Score-CAM and Faster-Score-CAM"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/tabayashi0117/Score-CAM"
Article = "https://qiita.com/futakuchi0117/items/95c518254185ec5ea485"

[project.optional-dependencies]
# Linux + NVIDIA. The old `tensorflow-gpu` package was discontinued after 2.10.
gpu = ["tensorflow[and-cuda]>=2.16"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "scikit-learn>=1.3",   # used by the DAGM example in the notebook
    "jupyterlab>=4.0",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scorecam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Keras announces upcoming breakage as UserWarning ("The structure of
    # `inputs` doesn't match ..."). Failing on it is how this repository finds
    # out about the next Keras 3 change before its users do.
    "error::UserWarning",
    "ignore::DeprecationWarning",
]
